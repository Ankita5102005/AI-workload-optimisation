# Sweep configuration (used from Stage 1 onward).
# Stage 1 reads every section below. Later stages reuse `sweep`, `baseline`
# and `workloads`, and ignore `gpu` / `stage1` (those only drive the simulator).

workloads: [resnet18, distilbert]

# The "default" configuration every candidate is compared against.
# power_limit_w should equal the GPU's default power limit
# (check with: nvidia-smi -q -d POWER).
baseline:
  power_limit_w: 300     # confirmed from `nvidia-smi -q -d POWER` on the real V100-DGXS-32GB
  batch_size: 32
  precision: fp32

# Grid of candidate configurations. Range confirmed via
# `nvidia-smi --query-gpu=power.min_limit,power.max_limit --format=csv` on the real card.
sweep:
  power_limit_w: [100, 125, 150, 175, 200, 225, 250, 275, 300]
  batch_size: [8, 16, 32, 64, 128, 256]
  precision: [fp32, fp16]

# Simulated GPU (Stage 1 only; not used from Stage 2 onward).
# Values now match the real card: Tesla V100-DGXS-32GB, confirmed 100-300 W range, default/max 300 W.
gpu:
  tdp_w: 300.0
  idle_w: 37.0            # measured idle draw on the real card (Stage 3 `Idle power:` line)
  min_power_limit_w: 100.0
  power_exponent: 2.5   # dynamic power ~ clock^2.5

stage1:
  seed: 42
  num_samples: 4096        # samples processed per simulated run
  noise_std: 0.02          # multiplicative log-normal noise on runtime
  max_slowdown: 1.05       # runtime must be <= 1.05 x baseline runtime
  repeats: 3               # runs per candidate (median is used)
  baseline_repeats: 5      # runs for the baseline measurement (median)
  strategy: grid           # grid | random
  random_budget: 40        # number of candidates when strategy = random

# Stage 2: real GPU runs on Colab/Kaggle. Power limit cannot be changed there, so only
# `sweep.batch_size` and `sweep.precision` are used; the limit is read and logged.
stage2:
  total_samples:           # inferences per timed run (same for every config of a workload)
    resnet18: 8192         # must be divisible by every batch size
    distilbert: 4096
  repeats: 3               # runs per config (order is shuffled across repeats)
  warmup_batches: 5        # untimed batches before each timed run
  poll_interval_s: 0.05    # NVML polling interval
  cooldown_s: 2.0          # pause between runs
  seed: 0                  # shuffling seed

# Stage 4: real power-limit control on the V100, on top of Stage 3's baseline sweep.
# All power-limit reads/writes/restores MUST go through actuator/power_control.py exclusively.
stage4:
  test_values_w: [300, 275, 250, 225, 200]  # manual, one at a time, starting at default, before any automated sweep
  stability_check:
    batch_size: 32
    precision: fp32
    total_samples: 1024     # small inference to confirm the GPU still responds normally after a change
